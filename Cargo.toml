[workspace]
resolver = "2"
members = [
    "crates/watch-types",
    "crates/hotl-theme",
    "crates/watch-tmux",
    "crates/watch-listener",
    "crates/watch-tui",
    "crates/hotl-types",
    "crates/hotl-platform",
    "crates/hotl-provider",
    "crates/hotl-provider-anthropic",
    "crates/hotl-provider-openai",
    "crates/hotl-minify",
    "crates/hotl-tools",
    "crates/hotl-mcp",
    "crates/hotl-retrieval",
    "crates/hotl-store",
    "crates/hotl-context",
    "crates/hotl-tui",
    "crates/hotl-engine",
    "crates/hotl-testkit",
    "crates/hotl",
]

[workspace.package]
version = "0.13.0"
edition = "2021"
rust-version = "1.88"
authors = ["nrakochy"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/nrakochy/hotl"
homepage = "https://github.com/nrakochy/hotl"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
# "rc" is for Item::User's Arc<str> image payload; Arc identity is not
# preserved across a round-trip, which a flat append-only log does not need.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# PreparedPayload's wire buffer (commit-protocol.md §Proposal payloads):
# cheap `Clone` (refcounted) so a prepared entry's bytes travel from the turn
# task to the actor without a copy.
bytes = "1"
toml = "0.8"
toml_edit = "0.22"
# Harness deps (execute capability). Why: tokio is the one async runtime the
# ecosystem is shaped around (rust-specs); reqwest/rustls avoids openssl.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "signal", "time", "fs", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
thiserror = "2"
anyhow = "1"
ulid = "1"
tempfile = "3"
async-stream = "0.3"
jsonschema = { version = "0.26", default-features = false }
libc = "0.2"
sha2 = "0.10"
# `hotl update` unpacks the release archive. Pure-Rust backends on purpose:
# `cargo install hotl` must not start needing a C toolchain (same reasoning as
# reqwest/rustls above). Relaxed 2026-07-29 for tree-sitter only (Decision D1):
# the grammars below compile C, so they sit behind hotl-tools' default-on
# `minify` feature — `cargo install hotl --no-default-features` is still a
# pure-Rust build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# The parsing stack behind `read --minified` / `edit --minified`. Exact pins:
# a grammar's generated parser is ABI-versioned against the core, and the
# minifier's correctness depends on node kinds that a grammar bump can rename.
tree-sitter = "=0.26.11"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
# Ripgrep's own traversal + glob crates. `ignore` defaults to
# follow_links(false) — the cheapest containment layer — and is gitignore-aware;
# `globset` is a real glob matcher (`*` vs `**`, classes, alternates).
ignore = "0.4"
globset = "0.4"
# Canonicalization that does not hand back a `\\?\` verbatim path on Windows.
# A verbatim root silently never matches a `starts_with` containment check, so
# the boundary stops matching rather than erroring — see `clippy.toml`.
dunce = "1"
# Platform seam deps (hotl-platform). All pure-Rust or import-lib, so
# `cargo install hotl` still needs no C toolchain (see the `minify` note above).
getrandom = "0.3"
dirs = "6"
windows-sys = "0.61"

[profile.release]
strip = true

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `powershell` is the Windows
# counterpart of `shell` — it is what makes `irm <url> | iex` work, the same
# shape as the `curl | sh` line in the README.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# Windows ships **unconfined and labeled as such**: its write floor is written
# but uncertified, so `probe()` reports `Unavailable` and every exec is
# individually human-gated with an UNSANDBOXED banner. That is not a new
# posture — it is exactly what an old-kernel Linux box already gets, through
# the same machinery, and there is no principled line that admits one and
# excludes the other. `docs/SECURITY.md` carries the honest statement.
#
# arm64 Windows is deliberately absent: no CI runner, so the floor would be
# unverified there in a second, unexamined way.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# gzip, not the xz default: `hotl update` decodes in-process, and pure-Rust xz
# decoders are far narrower crates than flate2. Read at runtime by `dist plan`,
# so release.yml needs no regeneration — the same is true of `targets` and
# `installers` above, because the build matrix is `${{ matrix.* }}` throughout
# and release.yml names no target triple at all.
unix-archive = ".tar.gz"
# Deliberately NOT `windows-archive = ".zip"`, and this is the third time
# someone will want to "fix" it: gzip is what `update.rs` decodes in-process
# via flate2. A zip would need a second decoder for no user-visible gain, since
# the PowerShell installer unpacks either form. Consistency with other Windows
# tools is not worth a new unpack path in the self-updater.

# dist builds releases with the release profile plus thin LTO.
[profile.dist]
inherits = "release"
lto = "thin"
