name: Publish to crates.io

# Semver release flow: publishing is driven by an annotated version tag, never
# by ordinary commits (crates.io rejects re-publishing an existing version, so
# "publish on every commit" would just fail once the version stops changing).
#
# To cut a release, run `scripts/release.sh` — it pushes the release commit,
# waits for CI to go green on it, and only then creates and pushes the tag.
# This workflow verifies the tag, re-checks that CI was green on the commit,
# then publishes every workspace crate in dependency order.
on:
  push:
    tags:
      # Strict semver, optionally with a pre-release/build suffix
      # (v1.2.3, v1.2.3-rc.1, v1.2.3+meta). Non-semver tags are ignored.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Never run two publishes concurrently — crates.io publishes are irreversible.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # the gate below reads this commit's check runs

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io # gate on a protected environment for manual approval
    # Above HOTL_CI_WAIT_TIMEOUT's 30-minute default, so the script's own
    # message is the one the operator reads.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag is semver and matches the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Strict semver (major.minor.patch[-prerelease][+build]).
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver_re ]]; then
            echo "::error::Tag '$tag' is not valid semver (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          # The tag must match the version the crates will actually publish as.
          # jq is preinstalled on GitHub-hosted runners.
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hotl") | .version')"
          echo "tag version:      $version"
          echo "manifest version: $manifest_version"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Tag ($version) != Cargo.toml version ($manifest_version). Bump the manifest and re-tag."
            exit 1
          fi

      # ci.yml ignores tags (ci.yml:13), so the only green-CI evidence for this
      # commit is the run from its branch push. No evidence => refuse: crates.io
      # publishes are irreversible. Sits with the other cheap refusals, ahead of
      # the publish.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-ci.sh "$GITHUB_SHA"

      # No test step: the gate above already requires this commit's ci.yml run
      # to be green, and publishing compiles each crate as it uploads.

      # `cargo publish --workspace` orders the crates and waits for each to
      # reach the index; the script excludes crates already published at this
      # version, so a re-run after a partial publish resumes. Replaced
      # katyo/publish-crates, which keyed dependencies by name: hotl-tools'
      # dev-dependency on hotl-context overwrote the normal one, the sort then
      # ignored it, and v0.29.0 stopped after 8 of 22 crates.
      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh
