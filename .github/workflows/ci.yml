name: CI

# Build, test, and lint on every push and pull request. Publishing is a
# separate, tag-triggered workflow (see publish.yml) — this one just keeps the
# default branch green.
#
# Watch and harness run as separate jobs: a red
# harness must never block a `hotl watch` hotfix, and vice versa. The binary
# crate depends on both, so it builds in the harness job (the bigger tree).
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"] # tag pushes are handled by publish.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Workspace-wide formatting gate. Separate from the build jobs so a
  # style-only failure is legible at a glance, and cheap (no build cache).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all --check

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: watch
      - name: Clippy (watch crates)
        run: cargo clippy -p hotl-theme -p hotl-watch-types -p hotl-watch-tmux -p hotl-watch-listener -p hotl-watch-tui --all-targets -- -D warnings
      - name: Test (watch crates)
        run: cargo test -p hotl-theme -p hotl-watch-types -p hotl-watch-tmux -p hotl-watch-listener -p hotl-watch-tui --locked
      - name: Test (hotl-theme without the ratatui feature)
        # Alone in the invocation so feature unification with the TUI crates
        # can't mask a featureless-build breakage.
        run: cargo test -p hotl-theme --locked

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: harness
      # The grep tool spawns the `rg` binary, which the runner image does not
      # ship — without it the grep test dies at spawn, before reaching the
      # exit-code semantics it exists to pin. Installed rather than
      # skipped-when-absent: a test that quietly evaporates on the one machine
      # gating master is not coverage.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Clippy (harness crates + binary)
        run: cargo clippy -p hotl-types -p hotl-platform -p hotl-provider -p hotl-provider-anthropic -p hotl-provider-openai -p hotl-minify -p hotl-tools -p hotl-store -p hotl-context -p hotl-mcp -p hotl-tui -p hotl-engine -p hotl-workflow -p hotl-testkit -p hotl --all-targets -- -D warnings
      - name: Test (harness crates + binary)
        # `--no-fail-fast`: run every crate's tests even after one fails, so a
        # single run surfaces the whole failure set instead of one-per-round.
        run: cargo test -p hotl-types -p hotl-platform -p hotl-provider -p hotl-provider-anthropic -p hotl-provider-openai -p hotl-minify -p hotl-tools -p hotl-store -p hotl-context -p hotl-mcp -p hotl-tui -p hotl-engine -p hotl-workflow -p hotl-testkit -p hotl --locked --no-fail-fast
      - name: Test (security-enforced feature)
        run: |
          cargo test -p hotl-tools --features security-enforced --locked
          cargo test -p hotl --features security-enforced --locked
      # Decision D1's escape hatch, gated because it is easy to break silently:
      # every internal crate between `hotl` and `hotl-tools` has to opt out of
      # default features *and* forward `minify`, or feature unification pulls
      # the C-compiling tree-sitter stack back in and this build stops being
      # pure Rust. A `cargo check` would not notice; the grep does.
      - name: Build without the minify feature (no C toolchain)
        run: |
          cargo test -p hotl --no-default-features --locked
          ! cargo tree -p hotl --no-default-features -e normal | grep -q tree-sitter

  # The Windows twin of `harness`. Real execution, not a cross-check: the
  # `msrv` job already catches Windows-breaking *compilation* on every PR, and
  # this is the only place the reparse-point refusals, the job-object reaper
  # and the named-pipe session actually run.
  #
  # Clippy with `-D warnings` on this leg is what keeps the inactive `#[cfg]`
  # arm honest — a split generates `unused_imports`/`dead_code` on the other
  # arm constantly, and nothing else in CI compiles that arm.
  harness-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: harness-windows
      # Same reason as the Linux leg: the grep tool spawns `rg`, and a test
      # that evaporates at spawn is not coverage. Chocolatey exits 0 even when
      # its feed 503s and installs nothing, so retry until `rg` is actually
      # resolvable rather than trusting the exit code.
      - name: Install ripgrep
        shell: pwsh
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -ErrorAction SilentlyContinue
          for ($i = 1; $i -le 5; $i++) {
            choco install ripgrep -y --no-progress
            Update-SessionEnvironment
            if (Get-Command rg -ErrorAction SilentlyContinue) { break }
            Write-Host "ripgrep not resolvable yet (attempt $i/5); retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          # Put the native rg.exe ahead of Chocolatey's shim on PATH: the shim's
          # stdout does not reach a *detached* child's pipe (the grep tool
          # detaches its session), so grep would see empty output through it.
          $rg = Get-ChildItem "$env:ChocolateyInstall\lib\ripgrep" -Recurse -Filter rg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rg) { Add-Content -Path $env:GITHUB_PATH -Value $rg.DirectoryName }
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { throw "ripgrep is not installed after 5 attempts" }
          rg --version
      - name: Clippy (harness crates + binary)
        run: cargo clippy -p hotl-types -p hotl-platform -p hotl-provider -p hotl-provider-anthropic -p hotl-provider-openai -p hotl-minify -p hotl-tools -p hotl-store -p hotl-context -p hotl-mcp -p hotl-tui -p hotl-engine -p hotl-workflow -p hotl-testkit -p hotl --all-targets -- -D warnings
      - name: Test (harness crates + binary)
        # `--no-fail-fast`: run every crate's tests even after one fails, so a
        # single run surfaces the whole failure set instead of one-per-round.
        run: cargo test -p hotl-types -p hotl-platform -p hotl-provider -p hotl-provider-anthropic -p hotl-provider-openai -p hotl-minify -p hotl-tools -p hotl-store -p hotl-context -p hotl-mcp -p hotl-tui -p hotl-engine -p hotl-workflow -p hotl-testkit -p hotl --locked --no-fail-fast
      - name: Test (security-enforced feature)
        run: |
          cargo test -p hotl-tools --features security-enforced --locked
          cargo test -p hotl --features security-enforced --locked
      # windows-latest ships MSVC Build Tools, so the six tree-sitter grammars
      # compile with no extra setup — but the feature-unification guard still
      # has to run here, because a crate forgetting `default-features = false`
      # breaks the pure-Rust build on every platform at once.
      - name: Build without the minify feature (no C toolchain)
        run: |
          cargo test -p hotl --no-default-features --locked
          if (cargo tree -p hotl --no-default-features -e normal | Select-String -Quiet tree-sitter) { exit 1 }
      # Git for Windows puts `sh.exe` on the runner, so the leg above exercises
      # the bash tool for real. This one removes it from PATH and asserts the
      # tool drops out of the registry cleanly rather than falling back to a
      # different language — the fail-closed row that matters most on Windows.
      - name: Test with no POSIX shell on PATH
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { -not (Test-Path (Join-Path $_ 'sh.exe')) }) -join ';'
          $env:HOTL_SHELL = ''
          cargo test -p hotl-tools --locked shell_

  # MSRV floor gate. `rust-version` in Cargo.toml was declared but unverified —
  # every other job is @stable, so nothing caught the floor drifting upward.
  # This matters beyond tidiness: if MSRV climbs past what a nixpkgs stable
  # release ships, hotl gets dropped from that channel.
  #
  # The toolchain is derived from Cargo.toml rather than hardcoded, for the
  # same reason flake.nix derives the version — a literal here would be one
  # more thing release-time edits must remember.
  #
  # `--locked` also catches a Cargo.lock drifted from Cargo.toml, which would
  # break the nix build: buildRustPackage vendors strictly from the lockfile.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "v=$(grep -m1 '^rust-version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check at the declared MSRV
        run: cargo check --workspace --locked --all-targets
      # NO Windows cross-check here. It was tried and it cannot work: `ring`'s
      # build script needs a C compiler for the target and rejects GNU for the
      # `-msvc` triple ("GNU compiler is not supported for this target"), so
      # there is no way to cross to MSVC from a Linux runner. The `msvc` half
      # of "zero marginal cost" was never available.
      #
      # It is also redundant now. `harness-windows` compiles and runs the suite
      # on a real Windows runner on every push, which is strictly more than a
      # cross-check would have told us. Locally the same coverage comes from
      # clippy against `x86_64-pc-windows-gnu` under mingw — `cfg(windows)` and
      # `windows-sys` are identical across the two ABIs.

  # Docs-site build guard: catches a broken page, link, or config in site/
  # before release day (docs.yml deploys the site on `release: published`).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build docs site
        run: npm ci && npm run build
        working-directory: site

  # Detects whether a push touched anything the nix legs actually build, so a
  # docs/site/changelog-only push skips two ~8-minute cold builds that could
  # not have turned out differently. First-party only (checkout + git).
  # Fail-open: any doubt — force push, branch creation, unreachable `before`,
  # a non-push event — counts as a build-input change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-inputs: ${{ steps.diff.outputs.build-inputs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          verdict=true
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] \
            && ! printf '%s' "$before" | grep -q '^0*$' \
            && git cat-file -e "$before" 2>/dev/null; then
            if ! git diff --name-only "$before" "${{ github.sha }}" | grep -qE \
              '^crates/|^Cargo\.(toml|lock)$|^flake\.(nix|lock)$|^\.github/workflows/ci\.yml$'; then
              verdict=false
            fi
          fi
          echo "build-inputs=$verdict" >> "$GITHUB_OUTPUT"

  # Flake evaluation + build gate. `nix flake check` builds checks.package,
  # which is the package derivation with the test suite re-enabled — so this
  # leg stays predictive of the nixpkgs build, which keeps tests on.
  #
  # Deliberately master-only: it is a full cold Rust build plus the suite on
  # each leg (nixpkgs delivers the toolchain prebuilt, never our dependency
  # tree), and it duplicates coverage the jobs above already have on PRs. Its
  # real job is proving *the flake* still evaluates and builds. Release tags
  # get their own leg in nix-tag.yml, against the published tag. Skipped
  # entirely (via `changes`) when the push touched no build inputs: src = self
  # means a docs-only push does yield a new derivation hash, but nothing in it
  # can change what this leg gates — whether the flake evaluates, builds, and
  # passes its suite.
  #
  # macos-latest is not redundant with ubuntu: darwin has the weaker sandbox
  # and different PTY semantics, so checkPhase behavior diverges there.
  nix:
    needs: changes
    if: github.ref == 'refs/heads/master' && needs.changes.outputs.build-inputs == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check --print-build-logs

  # Dependency vulnerability scan. Runs
  # cargo-audit against the committed Cargo.lock. cargo-audit installs from
  # crates.io — the same trust root as the build — so this adds no new
  # third-party GitHub Action to the supply chain.
  #
  # The other half of H-08 (pin actions by commit SHA rather than mutable tag)
  # is intentionally left to Dependabot: resolving each action's current SHA
  # needs network access this repo's authors do the pin from, and Dependabot
  # keeps SHAs current after. Tracked in the evaluation response.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ~3 minutes of this job was compiling cargo-audit itself on a fresh
      # runner — the scan is seconds. Cache the compiled binary keyed on its
      # crates.io version: the trust root is unchanged (still this runner
      # compiling the crates.io source, no new third-party action), and the
      # advisory DB is never cached — every run fetches current advisories.
      - id: audit-version
        name: Resolve current cargo-audit version
        # CARGO_TERM_COLOR=never: the toolchain action exports `always`, and
        # the ANSI codes that forces into piped output break the line anchor.
        run: |
          v="$(CARGO_TERM_COLOR=never cargo search cargo-audit --limit 1 2>/dev/null \
            | sed -nE 's/^cargo-audit = "([0-9.]+)".*/\1/p')"
          echo "v=${v:-unresolved}" >> "$GITHUB_OUTPUT"
      # Skipped when the version lookup failed, so a stale "unresolved" entry
      # can never mask a new release — the install step below runs instead.
      - uses: actions/cache@v4
        id: audit-cache
        if: steps.audit-version.outputs.v != 'unresolved'
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.audit-version.outputs.v }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings
