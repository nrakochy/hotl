[package]
name = "hotl-store"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. L5 persistence: append-only JSONL session log with ingestion-time secret masking."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
hotl-types = { path = "../hotl-types", version = "0.6.1" }
serde = { workspace = true }
# `raw_value`: `append_prepared`'s envelope splice needs `RawValue` to embed
# an already-serialized payload without a second JSON pass (commit-protocol.md
# §Proposal payloads).
serde_json = { workspace = true, features = ["raw_value"] }
bytes = { workspace = true }
# The session log's writer runs on its own blocking thread; the actor awaits
# its ack (commit-protocol.md §Durability ordering). `sync` is the only
# feature this crate uses.
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
