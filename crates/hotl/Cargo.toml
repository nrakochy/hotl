[package]
name = "hotl"
description = "Human-on-the-loop terminal AI agent: steering TUI + headless mode, gated tools under a kernel sandbox floor, session resume + undo, MCP/ACP, any Anthropic or OpenAI-compatible model — plus `hotl watch`, a tmux dashboard for the agents you already run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://nrakochy.github.io/hotl/"
readme = "README.md"
keywords = ["agent", "llm", "sandbox", "mcp", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hotl"
path = "src/main.rs"

# The Windows floor's launcher. Declared explicitly rather than left to cargo's
# `src/bin/` auto-discovery, because it is load-bearing for distribution: `dist`
# packages what cargo metadata reports, and `winfloor::shim_path()` resolves
# this binary *beside* `hotl` by absolute path. An archive that shipped `hotl`
# without it would report the floor `Unavailable` for a reason that reads like
# a bug rather than a missing file.
#
# It still builds on every platform — the non-Windows arm is a stub that
# explains itself and exits — so `cargo check --workspace` covers the file
# everywhere, which caught real errors during the port. But the stub links the
# crate graph and strips to ~330 KiB, not the "few KB" first assumed, so the
# per-target override below keeps it out of the Unix archives entirely.
[[bin]]
name = "hotl-sbx"
path = "src/bin/hotl-sbx.rs"

# Which binaries each target's archive — and so the shell installer — carries.
# Same map shape as `min-glibc-version`: the `"*"` arm covers every triple the
# explicit arm does not name. The shim is meaningless off Windows (the Unix
# floors are in-process), so only the Windows archive ships it. Guarded by
# `dist_ships_this_binary_in_the_windows_archive_alone`.
[package.metadata.dist.binaries]
"*" = ["hotl"]
x86_64-pc-windows-msvc = ["hotl", "hotl-sbx"]

[features]
default = ["minify"]
# Forwarded compile-time permission enforcement: per-action asks cannot be
# disabled by any config in a binary built with this.
security-enforced = ["hotl-tools/security-enforced"]
# Forwarded tree-sitter minified read/edit (Decision D1). Default on;
# `cargo install hotl --no-default-features` is a pure-Rust build.
minify = ["hotl-mcp/minify", "hotl-retrieval/minify", "hotl-engine/minify", "hotl-tui/minify", "hotl-tools/minify"]

[dependencies]
dunce = { workspace = true }
hotl_theme = { package = "hotl-theme", path = "../hotl-theme", version = "0.21.0", features = ["ratatui"] }
watch_types = { package = "hotl-watch-types", path = "../watch-types", version = "0.21.0" }
watch_tmux = { package = "hotl-watch-tmux", path = "../watch-tmux", version = "0.21.0" }
watch_listener = { package = "hotl-watch-listener", path = "../watch-listener", version = "0.21.0" }
watch_tui = { package = "hotl-watch-tui", path = "../watch-tui", version = "0.21.0" }
ratatui = { workspace = true }
crossterm = { workspace = true }
hotl-types = { path = "../hotl-types", version = "0.21.0" }
hotl-platform = { path = "../hotl-platform", version = "0.21.0" }
hotl-provider = { path = "../hotl-provider", version = "0.21.0" }
hotl-provider-anthropic = { path = "../hotl-provider-anthropic", version = "0.21.0" }
hotl-provider-openai = { path = "../hotl-provider-openai", version = "0.21.0" }
hotl-provider-openai-responses = { path = "../hotl-provider-openai-responses", version = "0.21.0" }
hotl-tools = { path = "../hotl-tools", version = "0.21.0", default-features = false }
hotl-mcp = { path = "../hotl-mcp", version = "0.21.0", default-features = false }
hotl-retrieval = { path = "../hotl-retrieval", version = "0.21.0", default-features = false }
hotl-store = { path = "../hotl-store", version = "0.21.0" }
hotl-context = { path = "../hotl-context", version = "0.21.0" }
hotl-engine = { path = "../hotl-engine", version = "0.21.0", default-features = false }
hotl-tui = { path = "../hotl-tui", version = "0.21.0", default-features = false }
hotl-workflow = { path = "../hotl-workflow", version = "0.21.0" }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
