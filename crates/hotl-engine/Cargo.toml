[package]
name = "hotl-engine"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. L3 turn engine, M0 slice: sample→tools loop, max_turns, cancellation."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["minify"]
# Forwarded to hotl-tools (Decision D1). Every internal dependent must forward
# it, or feature unification re-enables the tree-sitter stack that
# `--no-default-features` was meant to drop.
minify = ["hotl-retrieval/minify", "hotl-tools/minify"]

[dependencies]
hotl-types = { path = "../hotl-types", version = "0.16.0" }
hotl-platform = { path = "../hotl-platform", version = "0.16.0" }
hotl-provider = { path = "../hotl-provider", version = "0.16.0" }
hotl-context = { path = "../hotl-context", version = "0.16.0" }
hotl-tools = { path = "../hotl-tools", version = "0.16.0", default-features = false }
hotl-store = { path = "../hotl-store", version = "0.16.0" }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
# LoopLedger's RSS column (§S1): `getrusage(RUSAGE_SELF)` — not a workspace
# dependency yet outside hotl-tools/hotl, so pinned locally here too.

[dev-dependencies]
hotl-retrieval = { path = "../hotl-retrieval", version = "0.16.0", default-features = false }
tempfile = { workspace = true }
# test-util: paused-clock tests measure summarize/sample overlap deterministically.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
