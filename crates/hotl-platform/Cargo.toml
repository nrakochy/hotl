[package]
name = "hotl-platform"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. Platform seams: one capability trait per concern, one adapter per platform."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Fake adapters for contract tests. Never in the default build: a fake
# `PrivateFs` reaching production is a worse bug than the one it was written
# to catch.
testing = []

[dependencies]
getrandom = { workspace = true }
dirs = { workspace = true }
# `process` for Command/Child in the ProcessControl seam; no runtime is started
# here, only commands shaped and handles adopted.
tokio = { workspace = true, features = ["process", "net", "io-util", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `windows-sys`, not `windows`: these are a handful of flat C calls and the COM
# machinery in `windows` is a large build cost for nothing.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }
