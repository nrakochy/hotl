[package]
name = "hotl-tui"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. Elm-style ratatui console (state, update, view) for the execute agent. Before 0.2.0 this crate name shipped hotl's watch/dashboard TUI (now hotl-watch-tui)."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tui", "ratatui", "agent", "console"]
categories = ["command-line-utilities"]

[features]
default = ["minify"]
# Forwarded to hotl-tools (Decision D1). Every internal dependent must forward
# it, or feature unification re-enables the tree-sitter stack that
# `--no-default-features` was meant to drop.
minify = ["hotl-tools/minify"]

[dependencies]
hotl_theme = { package = "hotl-theme", path = "../hotl-theme", version = "0.12.0", features = ["ratatui"] }
hotl-tools = { path = "../hotl-tools", version = "0.12.0", default-features = false }
# A leaf crate with no I/O — added to *remove* a hand-copied
# `normalize_session_name`, not to reach the engine (§7).
hotl-types = { path = "../hotl-types", version = "0.12.0" }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync"] }
unicode-width = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
