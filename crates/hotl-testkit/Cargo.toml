[package]
name = "hotl-testkit"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. Golden-transcript test harness: scripted provider + real engine + normalized persisted transcripts."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["minify"]
# Forwarded to hotl-tools (Decision D1). Every internal dependent must forward
# it, or feature unification re-enables the tree-sitter stack that
# `--no-default-features` was meant to drop.
minify = ["hotl-engine/minify", "hotl-tools/minify"]

[dependencies]
hotl-types = { path = "../hotl-types", version = "0.18.0" }
hotl-platform = { path = "../hotl-platform", version = "0.18.0" }
hotl-provider = { path = "../hotl-provider", version = "0.18.0" }
hotl-tools = { path = "../hotl-tools", version = "0.18.0", default-features = false }
hotl-store = { path = "../hotl-store", version = "0.18.0" }
hotl-engine = { path = "../hotl-engine", version = "0.18.0", default-features = false }
# The `wire` module states its claims over *provider-serialized* request bytes,
# so the kit needs one real dialect to serialize with. A dependency rather than
# a dev-dependency since `wire` is public: hotl-engine's fork-cache test is a
# consumer, and the byte-prefix claim it makes has to be the same claim the
# in-crate cache scenarios make.
hotl-provider-anthropic = { path = "../hotl-provider-anthropic", version = "0.18.0" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# The minified-read savings assertion is stated on the engine's own estimator,
# not a private one.
hotl-context = { path = "../hotl-context", version = "0.18.0" }
