[package]
name = "hotl-tools"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. L4 tool system: read/edit/write/bash built-ins, permission gate seam, protected execute-later paths."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["minify"]
# Compile-time permission enforcement: with this on, mode=auto cannot exist
# at runtime (Rules::with_mode coerces it to Ask — see rules.rs).
security-enforced = []
# The tree-sitter parsing stack behind `read --minified` / `edit --minified`.
# A build-footprint flag, not a security contract: the grammars compile C, and
# `--no-default-features` restores the pure-Rust build (Decision D1). With it
# off, `minified: true` is a prompt-shaped error and the schema omits the arg.
minify = ["dep:hotl-minify", "dep:hotl-context"]

[dependencies]
dunce = { workspace = true }
hotl-platform = { path = "../hotl-platform", version = "0.16.0" }
hotl-context = { path = "../hotl-context", version = "0.16.0", optional = true }
hotl-minify = { path = "../hotl-minify", version = "0.16.0", optional = true }
hotl-provider = { path = "../hotl-provider", version = "0.16.0" }
hotl-types = { path = "../hotl-types", version = "0.16.0" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
