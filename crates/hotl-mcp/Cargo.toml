[package]
name = "hotl-mcp"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. M3a MCP client: stdio JSON-RPC, deferred loading, sanitizer chokepoint, trust store."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["minify"]
# Forwarded to hotl-tools (Decision D1). Every internal dependent must forward
# it, or feature unification re-enables the tree-sitter stack that
# `--no-default-features` was meant to drop.
minify = ["hotl-tools/minify"]

[dependencies]
dunce = { workspace = true }
hotl-tools = { path = "../hotl-tools", version = "0.23.0", default-features = false }
hotl-types = { path = "../hotl-types", version = "0.23.0" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
