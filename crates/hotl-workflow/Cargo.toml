[package]
name = "hotl-workflow"
description = "Internal component of hotl - no semver promise; pin exact or don't depend. Declarative multi-agent workflow runner: plan schema, selectors, executor, Mermaid."
readme = "../INTERNAL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# No `hotl-tools` on purpose: this crate stays outside the `minify` feature
# chain and needs no `[features]` of its own. `hotl-provider` is featureless
# and pure, pulled in for `Effort` alone.
[dependencies]
hotl-provider = { path = "../hotl-provider", version = "0.23.0" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
